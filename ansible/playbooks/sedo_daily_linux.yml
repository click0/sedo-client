---
# SEDO daily check via Virtual token on Linux (Wine prefix)
# No Windows worker, no WinRM — everything runs on the controller or a
# dedicated Linux worker.
#
# Prerequisites (see docs/LINUX-WINE-DEPLOYMENT.md):
#   - 32-bit Wine prefix at {{ wine_prefix }}
#   - IIT DLLs + Key-6.dat in {{ sedo_libs }}
#   - Registry keys set inside the prefix
#
# The PIN reaches the client as the SEDO_PIN environment variable
# (sedo_client.py: --pin → SEDO_PIN → getpass), but NOT through Ansible's
# `environment:`: on a Linux host Ansible prepends that to the `sh -c` it runs,
# so the PIN would show in the `-vvv` log despite no_log and in `ps` for the
# whole run. The PINs go on stdin instead; a small sh wrapper (pin_exec) reads
# them into the environment and execs the client. no_log stays on the run task;
# rc/stdout/stderr are shown by a separate task on failure.
#
# ⚠️  ВАЖЛИВО ПРО ІНТЕРПРЕТАТОР
#
# `--backend virtual` НЕ працює з нативним `python3`. PKCS11.Virtual.
# EKeyAlmaz1C.dll — це 32-bit Windows PE; PyKCS11 під нативним CPython робить
# dlopen(), який такий файл завантажити не може, а WINEPREFIX на нативний
# процес не впливає взагалі. Раніше цей playbook проходив усі чотири
# preflight-перевірки і помирав усередині PyKCS11 з незрозумілою помилкою.
#
# Єдина конфігурація, що може працювати: Windows-Python УСЕРЕДИНІ Wine-
# префіксу запускає клієнта, тобто Python + PyKCS11 + DLL — усі віндовські
# (див. docs/IIT-ANALYSIS-ADDENDUM-v6.md §6.3). Тому інтерпретатор задається
# явно через `sedo_client_python` і не має «зручного» дефолту — playbook
# свідомо падає в preflight, а не глибоко в бібліотеці.
#
# Цей шлях ЩЕ НЕ ПЕРЕВІРЯВСЯ на живому Wine-префіксі з реальним Key-6.dat.

- name: SEDO daily check (Linux / Wine / virtual token)
  # localhost is only an anchor here; nothing runs on it (the block's when).
  # When every host of a play is failed or unreachable, Ansible stops the
  # whole playbook, and rescue does not catch an unreachable host. If the
  # connection to the only worker drops mid-run, there would be no
  # verification and no report without the anchor. A worker that is
  # unreachable from the start is caught by the block's first task.
  hosts: sedo_workers_linux:localhost
  # The block gathers facts after the connection check: play-level gathering
  # on an unreachable worker fails outside the block, past rescue.
  gather_facts: false
  vars_files:
    - ../inventory/vault.yml

  vars:
    date_today: "{{ ansible_date_time.date }}"
    client_path: "{{ sedo_client_path | default('/opt/sedo-client') }}"
    # Worker-local download dir; files are then fetched to the controller
    # under report_root/<host>/<date>/ (same layout as the Windows play).
    output_dir: "{{ client_path }}/downloads/{{ date_today }}"
    report_root: /opt/sedo-reports
    wine_prefix: "/opt/sedo-wine"
    sedo_libs: "{{ wine_prefix }}/drive_c/sedo-libs"
    virtual_module: "{{ sedo_libs }}/PKCS11.Virtual.EKeyAlmaz1C.dll"
    key_file: "{{ sedo_libs }}/Key-6.dat"

    # Інтерпретатор, який реально запускає клієнта. Мусить бути Windows-Python
    # усередині Wine-префіксу — див. блок ⚠️ у шапці файлу. Приклад:
    #   sedo_client_python: 'wine C:\Python312\python.exe'
    # Рядок ділиться за пробілами, backslash-і лишаються як є. Шлях із
    # пробілом — списком: ['wine', 'C:\Program Files\Python312\python.exe'].
    client_python: "{{ sedo_client_python | default('') }}"
    client_python_argv: >-
      {{ client_python if client_python is not string else client_python.split() }}

    # Reads NAME=VALUE lines (the PINs) from stdin into the environment, then
    # execs the client ("$@"). Only SEDO_PIN / SEDO_PIN_<PROFILE> are exported.
    pin_exec: >-
      while IFS= read -r line || [ -n "$line" ]; do
      case $line in SEDO_PIN=*|SEDO_PIN_*=*) export "$line";; esac;
      done; exec "$@"

    # Windows-форми тих самих шляхів, бо аргументи читає Windows-Python.
    # drive_c/sedo-libs усередині префіксу — це C:\sedo-libs (той самий шлях,
    # що прописаний у реєстрі згідно docs/LINUX-WINE-DEPLOYMENT.md §4).
    # Усе, що лежить поза префіксом, Wine бачить через диск Z:.
    sedo_libs_win: 'C:\sedo-libs'
    virtual_module_win: "{{ sedo_libs_win }}\\PKCS11.Virtual.EKeyAlmaz1C.dll"
    key_file_win: "{{ sedo_libs_win }}\\Key-6.dat"
    # No backslash or \n inside a Jinja string literal: Ansible keeps escapes
    # there as typed (checked on ansible-core 2.18 and 2.21), so '\\' is two
    # backslashes and '\n' two characters. "…'\\'…" in double-quoted YAML was
    # worse: Jinja got '\', an unterminated literal, and the run task died with
    # "Syntax error in template". The characters come from YAML instead.
    backslash: '\'
    newline: "\n"
    client_script_win: "Z:{{ (client_path ~ '/sedo_client.py') | replace('/', backslash) }}"
    output_dir_win: "Z:{{ output_dir | replace('/', backslash) }}"

  tasks:
    # Every worker step in one block. A failure of any step (no Wine Python,
    # missing Key-6.dat, the client failed) lands in rescue: the reason is
    # recorded and the worker is NOT marked failed. Otherwise, when every
    # worker fails (typically: the only one), Ansible stops the whole
    # playbook after this play, and neither verification, nor the summary,
    # nor the Telegram report run, exactly when the report matters most.
    # The run still ends in failure: the last task of the verification play.
    - name: Daily run of the worker
      when: inventory_hostname in groups['sedo_workers_linux']
      block:
        # Fail here, not inside PyKCS11. A native python3 cannot dlopen a 32-bit
        # Windows PE DLL, so there is no safe default for this variable.
        - name: Stop if the Wine Python interpreter is not configured
          ansible.builtin.fail:
            msg: >-
              sedo_client_python is not set. The virtual backend needs a WINDOWS
              Python running inside the Wine prefix — a native python3 cannot load
              PKCS11.Virtual.EKeyAlmaz1C.dll (32-bit PE), and WINEPREFIX has no
              effect on a native process. Set it in the inventory, for example
              sedo_client_python: 'wine C:\Python312\python.exe'
              and see docs/LINUX-WINE-DEPLOYMENT.md §6.
          when: not client_python

        # An unreachable host gives UNREACHABLE, which rescue does not catch.
        # wait_for_connection ends in a plain failure instead ("timed out
        # waiting for ping module test: …"), so a worker that is down reaches
        # the report with its reason. The register marks that the worker
        # started the run: the verification play tells a connection lost
        # mid-run apart from a worker left out by --limit this way.
        - name: Check that the worker is reachable
          ansible.builtin.wait_for_connection:
            connect_timeout: 10
            timeout: "{{ sedo_connect_timeout | default(120) }}"
          register: sedo_connection

        - name: Gather worker facts
          ansible.builtin.gather_facts:

        - name: Remember the worker date for the verification play
          ansible.builtin.set_fact:
            sedo_fetch_date: "{{ date_today }}"

        - name: Verify Wine prefix exists
          ansible.builtin.stat:
            path: "{{ wine_prefix }}/system.reg"
          register: wine_check

        - name: Stop if Wine prefix missing
          ansible.builtin.fail:
            msg: >-
              Wine prefix not found at {{ wine_prefix }}.
              Run `WINEARCH=win32 WINEPREFIX={{ wine_prefix }} wineboot --init`
              and see docs/LINUX-WINE-DEPLOYMENT.md
          when: not wine_check.stat.exists

        - name: Verify virtual PKCS#11 module is in place
          ansible.builtin.stat:
            path: "{{ virtual_module }}"
          register: module_check

        - name: Stop if virtual module missing
          ansible.builtin.fail:
            msg: >-
              PKCS11.Virtual.EKeyAlmaz1C.dll not found at {{ virtual_module }}.
              See docs/MINIMUM-FILES-LIST.md scenario B.
          when: not module_check.stat.exists

        - name: Verify Key-6.dat is in place
          ansible.builtin.stat:
            path: "{{ key_file }}"
          register: key_check

        - name: Stop if Key-6.dat missing
          ansible.builtin.fail:
            msg: "Key-6.dat not found at {{ key_file }}"
          when: not key_check.stat.exists

        - name: Create output directory
          ansible.builtin.file:
            path: "{{ output_dir }}"
            state: directory
            mode: '0750'

        # Key profiles (login with one key, sign with another) via config_local.toml
        # next to the client, rendered from sedo_keys / sedo_roles; profile PINs
        # from the vault (sedo_key_pins) as SEDO_PIN_<PROFILE>. Without sedo_keys
        # nothing changes: one key, SEDO_PIN, as before. Module paths inside the
        # profiles must be Windows-form (the client runs under Wine).
        - name: Render config_local.toml with key profiles
          ansible.builtin.template:
            src: config_local.toml.j2
            dest: "{{ client_path }}/config_local.toml"
            mode: '0640'
          when: sedo_keys is defined

        - name: Collect profile PINs as SEDO_PIN_<PROFILE>
          ansible.builtin.set_fact:
            sedo_pin_env: >-
              {{ sedo_pin_env | default({})
                 | combine({'SEDO_PIN_' ~ (item.key | upper | regex_replace('[^A-Z0-9]+', '_')): item.value}) }}
          loop: "{{ (sedo_key_pins[inventory_hostname] | default({})) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          no_log: true

        # Windows-форми шляхів: аргументи читає Windows-Python усередині префіксу.
        # argv, not cmd: a cmd string is split by shlex, which ate the
        # backslashes of 'wine C:\Python312\python.exe'. PINs only on stdin
        # (see the header); environment: carries nothing secret.
        - name: Run sedo-client with virtual backend
          vars:
            sedo_pins: >-
              {{ {'SEDO_PIN': virtual_pins[inventory_hostname]} | combine(sedo_pin_env | default({})) }}
          ansible.builtin.command:
            argv: >-
              {{ ['/bin/sh', '-c', pin_exec, 'sh'] + client_python_argv
                 + [client_script_win,
                    '--url', sedo_url | default('https://sedo.mod.gov.ua'),
                    '--backend', 'virtual',
                    '--module', virtual_module_win,
                    '--key-file', key_file_win,
                    '--fetch',
                    '--since', date_today,
                    '--output', output_dir_win] }}
            stdin: >-
              {{ sedo_pins.keys() | list | zip(sedo_pins.values() | list) | map('join', '=') | join(newline) }}
          environment:
            WINEPREFIX: "{{ wine_prefix }}"
          no_log: true
          register: sedo_result
          failed_when: false
          # "changed" only when something was actually downloaded, not on any rc==0.
          changed_when: "sedo_result.stdout is search('Документів: [1-9]')"

        # rc through default() as well: when command cannot even START the process
        # the result carries msg but no rc, and these tasks died with "dict object
        # has no attribute 'rc'", hiding the real cause — exactly what splitting
        # no_log from the diagnostics was meant to prevent.
        - name: Show client diagnostics on failure (rc / stdout / stderr, no PIN)
          ansible.builtin.debug:
            msg:
              rc: "{{ sedo_result.rc | default('(process did not start)') }}"
              msg: "{{ sedo_result.msg | default('') }}"
              stdout: "{{ sedo_result.stdout | default('') }}"
              stderr: "{{ sedo_result.stderr | default('') }}"
          when: sedo_result.rc | default(-1) != 0

        - name: Stop if the client failed
          ansible.builtin.fail:
            msg: >-
              sedo-client exited with rc={{ sedo_result.rc | default('(did not start)') }}
              — see diagnostics above
          when: sedo_result.rc | default(-1) != 0

        - name: Find downloaded documents
          ansible.builtin.find:
            paths: "{{ output_dir }}"
            patterns: "*.zip"
          register: downloaded

        # Works for a remote Linux worker and for lin01 (connection: local) alike.
        - name: Fetch to the controller
          ansible.builtin.fetch:
            src: "{{ item.path }}"
            dest: "{{ report_root }}/{{ inventory_hostname }}/{{ date_today }}/"
            flat: true
          loop: "{{ downloaded.files }}"
          when: downloaded.files | length > 0

        - name: Mark the worker as done
          ansible.builtin.set_fact:
            sedo_worker_done: true
      rescue:
        - name: Remember where the worker stopped (for the report)
          ansible.builtin.set_fact:
            sedo_worker_error: >-
              {{ ansible_failed_task.name | default('?') }}:
              {{ ansible_failed_result.msg | default('') | truncate(300) }}

- name: Verify downloaded signatures
  hosts: localhost
  gather_facts: true
  # For telegram.bot_token / chat_id (the Telegram report at the end).
  vars_files:
    - ../inventory/vault.yml
  vars:
    date_today: "{{ ansible_date_time.date }}"
    report_root: /opt/sedo-reports
    lost_worker_error: >-
      connection to the worker was lost mid-run (UNREACHABLE), the reason is
      in the Ansible log

  tasks:
    # A worker that started the run (sedo_connection) but reached neither the
    # end of the block nor rescue: its connection dropped mid-run, which
    # rescue does not catch. Without this the report showed it as "did not run".
    - name: Find workers whose connection was lost
      ansible.builtin.set_fact:
        lost_workers: >-
          {{ groups['sedo_workers_linux'] | default([]) | map('extract', hostvars)
             | selectattr('sedo_connection', 'defined')
             | rejectattr('sedo_worker_done', 'defined')
             | rejectattr('sedo_worker_error', 'defined')
             | map(attribute='inventory_hostname') | list }}

    - name: Find all ZIPs
      ansible.builtin.find:
        paths: "{{ report_root }}"
        patterns: "*.zip"
        recurse: true
      register: zip_files

    # The dates the workers actually used (fallback: the controller's date, if
    # play 1 was skipped by --limit). Filtering by the controller's date alone
    # silently skipped documents fetched by a worker in another timezone.
    - name: Collect the dates the workers used
      ansible.builtin.set_fact:
        fetch_dates: >-
          {{ (groups['sedo_workers_linux'] | default([])
              | map('extract', hostvars)
              | map(attribute='sedo_fetch_date', default='')
              | select('string') | reject('equalto', '')
              | unique | list) or [date_today] }}

    # Only those dates' directories (<host>/<date>/*.zip) — otherwise every run
    # re-verifies the whole history and verified/ grows without bound.
    - name: Select ZIPs for those dates
      ansible.builtin.set_fact:
        todays_zips: >-
          {{ zip_files.files | map(attribute='path')
             | select('search', '/(' ~ (fetch_dates | join('|')) ~ ')/')
             | reject('search', '/verified/') | list }}

    - name: Run ua-sign-verify on each document
      ansible.builtin.command:
        cmd: >-
          python3 /opt/ua-sign-verify/cli/main.py "{{ item }}"
          --result-dir "{{ report_root }}/verified/{{ date_today }}"
          --no-console
      loop: "{{ todays_zips }}"
      register: verify_results
      changed_when: false
      failed_when: false

    - name: Summary report
      ansible.builtin.debug:
        msg: |
          Total:    {{ verify_results.results | length }}
          Valid:    {{ verify_results.results | selectattr('rc', 'eq', 0) | list | length }}
          Warnings: {{ verify_results.results | selectattr('rc', 'eq', 1) | list | length }}
          Errors:   {{ verify_results.results | selectattr('rc', 'ne', 0) | selectattr('rc', 'ne', 1) | list | length }}

    # Telegram report, only when vault.yml has telegram.bot_token. Summary,
    # token and chat go as one JSON on stdin, under no_log. Not through
    # environment: on Linux Ansible prepends it to the command
    # (sh -c 'VAR=... python3 ...'), which puts the token in the -vvv log and
    # in ps. A separate task shows the outcome. A failed send does not fail
    # the run: verification is done and "Summary report" above showed it.
    - name: Collect worker state for the Telegram report
      ansible.builtin.set_fact:
        report_workers: >-
          {{ report_workers | default([]) + [{
               'host': item,
               'rc': (hostvars[item].sedo_result | default({})).rc | default(none),
               'stdout': (hostvars[item].sedo_result | default({})).stdout | default(''),
               'error': hostvars[item].sedo_worker_error
                        | default(lost_worker_error if item in lost_workers else none)}] }}
      loop: "{{ groups['sedo_workers_linux'] | default([]) }}"
      when: telegram.bot_token | default('') | length > 0

    - name: Collect verification results for the Telegram report
      ansible.builtin.set_fact:
        report_verify: "{{ report_verify | default([]) + [{'file': item.item, 'rc': item.rc | default(none)}] }}"
      loop: "{{ verify_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('?') }}"
      when: telegram.bot_token | default('') | length > 0

    - name: Send the report to Telegram
      ansible.builtin.command:
        cmd: python3 -m sedo.telegram_report --summary -
        chdir: "{{ playbook_dir }}/../.."
        stdin: >-
          {{ {'date': fetch_dates | join(', '),
              'workers': report_workers | default([]),
              'verify': report_verify | default([]),
              'telegram': {'bot_token': telegram.bot_token,
                           'chat_id': telegram.chat_id | default('')}} | to_json }}
      register: telegram_result
      changed_when: telegram_result.rc | default(1) == 0
      failed_when: false
      no_log: true
      when: telegram.bot_token | default('') | length > 0

    - name: Telegram report outcome (no token)
      ansible.builtin.debug:
        msg: >-
          rc={{ telegram_result.rc | default('(process did not start)') }}
          {{ telegram_result.stdout | default('') }}
          {{ telegram_result.stderr | default('') }}
          {{ telegram_result.msg | default('') if telegram_result.rc is not defined else '' }}
      when: telegram_result is defined and telegram_result is not skipped

    # Workers that stopped in rescue are not marked failed (else the
    # verification play would not run). The run must still end in failure
    # for cron and monitoring; the reason is already in the reports above.
    - name: Fail the run if any worker did not complete
      ansible.builtin.fail:
        msg: >-
          Workers with errors:
          {% for h in failed_workers %}{{ h }} ({{ hostvars[h].sedo_worker_error | default(lost_worker_error) }}){{ '; ' if not loop.last }}{% endfor %}
      vars:
        failed_workers: >-
          {{ groups['sedo_workers_linux'] | default([]) | map('extract', hostvars)
             | selectattr('sedo_worker_error', 'defined')
             | map(attribute='inventory_hostname') | list + lost_workers }}
      when: failed_workers | length > 0
