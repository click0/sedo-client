---
# SEDO daily check via Virtual token on Linux (Wine prefix)
# No Windows worker, no WinRM — everything runs on the controller or a
# dedicated Linux worker.
#
# Prerequisites (see docs/LINUX-WINE-DEPLOYMENT.md):
#   - 32-bit Wine prefix at {{ wine_prefix }}
#   - IIT DLLs + Key-6.dat in {{ sedo_libs }}
#   - Registry keys set inside the prefix
#
# The PIN reaches the client via the SEDO_PIN environment variable
# (sedo_client.py: --pin → SEDO_PIN → getpass), so it never appears on the
# command line / process list. no_log stays on the run task as defence in
# depth; rc/stdout/stderr are shown by a separate task on failure.

- name: SEDO daily check (Linux / Wine / virtual token)
  hosts: sedo_workers_linux
  gather_facts: true
  vars_files:
    - ../inventory/vault.yml

  vars:
    date_today: "{{ ansible_date_time.date }}"
    client_path: "{{ sedo_client_path | default('/opt/sedo-client') }}"
    # Worker-local download dir; files are then fetched to the controller
    # under report_root/<host>/<date>/ (same layout as the Windows play).
    output_dir: "{{ client_path }}/downloads/{{ date_today }}"
    report_root: /opt/sedo-reports
    wine_prefix: "/opt/sedo-wine"
    sedo_libs: "{{ wine_prefix }}/drive_c/sedo-libs"
    virtual_module: "{{ sedo_libs }}/PKCS11.Virtual.EKeyAlmaz1C.dll"
    key_file: "{{ sedo_libs }}/Key-6.dat"

  tasks:
    - name: Verify Wine prefix exists
      ansible.builtin.stat:
        path: "{{ wine_prefix }}/system.reg"
      register: wine_check

    - name: Stop if Wine prefix missing
      ansible.builtin.fail:
        msg: >-
          Wine prefix not found at {{ wine_prefix }}.
          Run `WINEARCH=win32 WINEPREFIX={{ wine_prefix }} wineboot --init`
          and see docs/LINUX-WINE-DEPLOYMENT.md
      when: not wine_check.stat.exists

    - name: Verify virtual PKCS#11 module is in place
      ansible.builtin.stat:
        path: "{{ virtual_module }}"
      register: module_check

    - name: Stop if virtual module missing
      ansible.builtin.fail:
        msg: >-
          PKCS11.Virtual.EKeyAlmaz1C.dll not found at {{ virtual_module }}.
          See docs/MINIMUM-FILES-LIST.md scenario B.
      when: not module_check.stat.exists

    - name: Verify Key-6.dat is in place
      ansible.builtin.stat:
        path: "{{ key_file }}"
      register: key_check

    - name: Stop if Key-6.dat missing
      ansible.builtin.fail:
        msg: "Key-6.dat not found at {{ key_file }}"
      when: not key_check.stat.exists

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0750'

    - name: Run sedo-client with virtual backend
      ansible.builtin.command:
        cmd: >-
          python3 {{ client_path }}/sedo_client.py
          --url "{{ sedo_url | default('https://sedo.mod.gov.ua') }}"
          --backend virtual
          --module "{{ virtual_module }}"
          --key-file "{{ key_file }}"
          --fetch
          --since "{{ date_today }}"
          --output "{{ output_dir }}"
      environment:
        WINEPREFIX: "{{ wine_prefix }}"
        SEDO_PIN: "{{ virtual_pins[inventory_hostname] }}"
      no_log: true
      register: sedo_result
      failed_when: false
      # "changed" only when something was actually downloaded, not on any rc==0.
      changed_when: "sedo_result.stdout is search('Документів: [1-9]')"

    - name: Show client diagnostics on failure (rc / stdout / stderr, no PIN)
      ansible.builtin.debug:
        msg:
          rc: "{{ sedo_result.rc }}"
          stdout: "{{ sedo_result.stdout | default('') }}"
          stderr: "{{ sedo_result.stderr | default('') }}"
      when: sedo_result.rc != 0

    - name: Stop if the client failed
      ansible.builtin.fail:
        msg: "sedo-client exited with rc={{ sedo_result.rc }} — see diagnostics above"
      when: sedo_result.rc != 0

    - name: Find downloaded documents
      ansible.builtin.find:
        paths: "{{ output_dir }}"
        patterns: "*.zip"
      register: downloaded

    # Works for a remote Linux worker and for lin01 (connection: local) alike.
    - name: Fetch to the controller
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ report_root }}/{{ inventory_hostname }}/{{ date_today }}/"
        flat: true
      loop: "{{ downloaded.files }}"
      when: downloaded.files | length > 0

- name: Verify downloaded signatures
  hosts: localhost
  gather_facts: true
  vars:
    date_today: "{{ ansible_date_time.date }}"
    report_root: /opt/sedo-reports

  tasks:
    - name: Find all ZIPs
      ansible.builtin.find:
        paths: "{{ report_root }}"
        patterns: "*.zip"
        recurse: true
      register: zip_files

    # Only today's directory (<host>/<date>/*.zip) — otherwise every run
    # re-verifies the whole history and verified/ grows without bound.
    - name: Select today's ZIPs
      ansible.builtin.set_fact:
        todays_zips: >-
          {{ zip_files.files | map(attribute='path')
             | select('search', '/' ~ date_today ~ '/')
             | reject('search', '/verified/') | list }}

    - name: Run ua-sign-verify on each document
      ansible.builtin.command:
        cmd: >-
          python3 /opt/ua-sign-verify/cli/main.py "{{ item }}"
          --result-dir "{{ report_root }}/verified/{{ date_today }}"
          --no-console
      loop: "{{ todays_zips }}"
      register: verify_results
      changed_when: false
      failed_when: false

    - name: Summary report
      ansible.builtin.debug:
        msg: |
          Total:    {{ verify_results.results | length }}
          Valid:    {{ verify_results.results | selectattr('rc', 'eq', 0) | list | length }}
          Warnings: {{ verify_results.results | selectattr('rc', 'eq', 1) | list | length }}
          Errors:   {{ verify_results.results | selectattr('rc', 'ne', 0) | selectattr('rc', 'ne', 1) | list | length }}
