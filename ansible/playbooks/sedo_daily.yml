---
# Щоденна перевірка СЕДО ЗСУ (sedo.mod.gov.ua)
# Windows-воркер з апаратним Алмаз-1К, PKCS#11 backend.
#
# PIN передається клієнту через змінну середовища SEDO_PIN (sedo_client.py:
# --pin → SEDO_PIN → getpass), тож він не потрапляє у командний рядок і
# список процесів. no_log лишається на самому запуску як захист у глибину;
# rc/stdout/stderr показуються окремим task-ом при провалі — там PIN нема.

- name: СЕДО ЗСУ — щоденна перевірка
  hosts: sedo_workers
  gather_facts: true
  vars_files:
    - ../inventory/vault.yml

  vars:
    date_today: "{{ ansible_date_time.date }}"
    output_dir: "{{ client_path }}\\downloads\\{{ date_today }}"
    report_root: /opt/sedo-reports
    # Інсталер IIT кладе DLL з крапкою (PKCS11.EKeyAlmaz1C.dll, див.
    # docs/MINIMUM-FILES-LIST.md); старі копії/інструкції — з підкресленням.
    # Приймаємо обидві назви, перша знайдена — переможець.
    pkcs11_module_candidates:
      - "{{ client_path }}\\libs\\PKCS11.EKeyAlmaz1C.dll"
      - "{{ client_path }}\\libs\\PKCS11_EKeyAlmaz1C.dll"

  tasks:
    - name: Перевірка Windows Smart Card service
      ansible.windows.win_service:
        name: SCardSvr
        state: started
        start_mode: auto

    - name: Пошук PKCS#11 модуля (обидві назви DLL)
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop: "{{ pkcs11_module_candidates }}"
      register: pkcs11_check

    - name: Обрати перший знайдений PKCS#11 модуль
      ansible.builtin.set_fact:
        pkcs11_module: >-
          {{ (pkcs11_check.results | selectattr('stat.exists')
              | map(attribute='item') | list + ['']) | first }}

    - name: Зупинити якщо DLL відсутня
      ansible.builtin.fail:
        msg: >-
          PKCS#11 модуль не знайдено. Перевірено:
          {{ pkcs11_module_candidates | join(', ') }}
      when: pkcs11_module == ''

    - name: Перевірка Алмаз
      ansible.windows.win_shell: |
        Get-PnpDevice -PresentOnly -Status OK |
          Where-Object { $_.FriendlyName -like "*Almaz*" -or $_.FriendlyName -like "*IIT*" } |
          Select-Object -First 1 FriendlyName
      register: almaz_check
      changed_when: false

    - name: Stop якщо Алмаз не підключений
      ansible.builtin.fail:
        msg: "Алмаз-1К не виявлено"
      when: almaz_check.stdout | trim == ""

    - name: Створити директорію для завантажень
      ansible.windows.win_file:
        path: "{{ output_dir }}"
        state: directory

    - name: Запуск клієнта з PKCS#11 backend
      ansible.windows.win_command:
        cmd: >
          "{{ python_path }}" "{{ client_path }}\sedo_client.py"
          --url "{{ sedo_url }}"
          --backend pkcs11
          --module "{{ pkcs11_module }}"
          --fetch
          --since "{{ date_today }}"
          --output "{{ output_dir }}"
      environment:
        SEDO_PIN: "{{ almaz_pins[inventory_hostname] }}"
      no_log: true
      register: sedo_result
      failed_when: false
      # "changed" лише коли реально щось завантажено, а не на кожен rc==0.
      changed_when: "sedo_result.stdout is search('Документів: [1-9]')"

    - name: Діагностика клієнта при провалі (rc / stdout / stderr, без PIN)
      ansible.builtin.debug:
        msg:
          rc: "{{ sedo_result.rc }}"
          stdout: "{{ sedo_result.stdout | default('') }}"
          stderr: "{{ sedo_result.stderr | default('') }}"
      when: sedo_result.rc != 0

    - name: Зупинити якщо клієнт завершився з помилкою
      ansible.builtin.fail:
        msg: "sedo-client завершився з rc={{ sedo_result.rc }} — див. діагностику вище"
      when: sedo_result.rc != 0

    - name: Знайти завантажені файли
      ansible.windows.win_find:
        paths: "{{ output_dir }}"
        patterns: "*.zip"
      register: downloaded

    - name: Fetch на Linux controller
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ report_root }}/{{ inventory_hostname }}/{{ date_today }}/"
        flat: true
      loop: "{{ downloaded.files }}"
      when: downloaded.files | length > 0

- name: Верифікація на Linux controller
  hosts: localhost
  gather_facts: true
  vars:
    date_today: "{{ ansible_date_time.date }}"
    report_root: /opt/sedo-reports

  tasks:
    - name: Знайти завантажені ZIP
      ansible.builtin.find:
        paths: "{{ report_root }}"
        patterns: "*.zip"
        recurse: true
      register: zip_files

    # Лише сьогоднішній каталог (<host>/<date>/*.zip) — інакше кожен запуск
    # переверифікує всю історію, а results/ під verified/ росте без меж.
    - name: Відібрати ZIP лише за сьогодні
      ansible.builtin.set_fact:
        todays_zips: >-
          {{ zip_files.files | map(attribute='path')
             | select('search', '/' ~ date_today ~ '/')
             | reject('search', '/verified/') | list }}

    - name: Запустити ua-sign-verify на кожен
      ansible.builtin.command:
        cmd: >
          python3 /opt/ua-sign-verify/cli/main.py "{{ item }}"
          --result-dir "{{ report_root }}/verified/{{ date_today }}"
          --no-console
      loop: "{{ todays_zips }}"
      register: verify_results
      changed_when: false
      failed_when: false

    - name: Звіт
      ansible.builtin.debug:
        msg: |
          Всього:   {{ verify_results.results | length }}
          Валідних: {{ verify_results.results | selectattr('rc', 'eq', 0) | list | length }}
          Warning:  {{ verify_results.results | selectattr('rc', 'eq', 1) | list | length }}
          Помилки:  {{ verify_results.results | selectattr('rc', 'ne', 0) | selectattr('rc', 'ne', 1) | list | length }}
