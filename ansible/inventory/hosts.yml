---
all:
  children:
    sedo_workers:
      hosts:
        ws01:
          ansible_host: 192.168.1.10
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: credssp
        # Validate the WinRM TLS cert — CredSSP delegates domain credentials
        # over this channel, so `ignore` would expose them to MITM.
        # Trust the worker's self-signed/CA cert via ca_trust_path.
        ansible_winrm_server_cert_validation: validate
        # ansible_winrm_ca_trust_path: /opt/sedo-client/certs/ws01-winrm.pem
        ansible_port: 5986
        ansible_user: ansible_operator
        ansible_password: "{{ winrm_passwords[inventory_hostname] }}"
        sedo_url: https://sedo.mod.gov.ua
        # Must match where SETUP-WINDOWS.md / README clone the repo.
        client_path: C:\sedo-client
        # The venv SETUP-WINDOWS.md §2.3 creates — it is the only interpreter
        # that has `requests` installed. A bare C:\PythonNNN\python.exe would
        # fail with ModuleNotFoundError, and the guide installs 3.12, not 3.11.
        python_path: C:\sedo-client\venv\Scripts\python.exe
        # opensc is what SETUP-WINDOWS.md and README recommend and what the
        # guide actually installs; PyKCS11 is marked optional there, so
        # defaulting to pkcs11 would break a worker built per the guide.
        sedo_backend: opensc
        # Optional: key profiles → config_local.toml on the worker (see
        # config.toml / config_local.toml.example). One key for the SEDO
        # login, another for signing documents. PINs: sedo_key_pins (vault).
        # sedo_keys:
        #   login:
        #     backend: opensc
        #     module: 'C:\Program Files (x86)\Institute of Informational Technologies\EKeys\Almaz1C\PKCS11.EKeyAlmaz1C.dll'
        #   doc:
        #     backend: pkcs11
        #     module: 'C:\Program Files (x86)\Institute of Informational Technologies\Certificate Authority-1.3\End User\Av337CryptokiD.dll'
        #     cert_id: "02"
        # sedo_roles:
        #   auth: login
        #   sign: doc

    # Linux worker(s) running sedo-client via Wine + virtual token.
    # No WinRM, no Windows box. See docs/LINUX-WINE-DEPLOYMENT.md
    sedo_workers_linux:
      hosts:
        lin01:
          ansible_host: 127.0.0.1
          ansible_connection: local
      vars:
        sedo_url: https://sedo.mod.gov.ua
        # REQUIRED for this group. The virtual backend loads a 32-bit Windows
        # PE DLL, so the client must run under a WINDOWS Python inside the Wine
        # prefix — a native python3 cannot dlopen it and WINEPREFIX does not
        # change that. The playbook fails in preflight while this is unset.
        # Install Python for Windows into the prefix, then uncomment:
        # sedo_client_python: 'wine C:\Python312\python.exe'
        #
        # Not yet verified on a live Wine prefix with a real Key-6.dat.
