---
all:
  children:
    sedo_workers:
      hosts:
        ws01:
          ansible_host: 192.168.1.10
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: credssp
        # Validate the WinRM TLS cert — CredSSP delegates domain credentials
        # over this channel, so `ignore` would expose them to MITM.
        # Trust the worker's self-signed/CA cert via ca_trust_path.
        ansible_winrm_server_cert_validation: validate
        # ansible_winrm_ca_trust_path: /opt/sedo-client/certs/ws01-winrm.pem
        ansible_port: 5986
        ansible_user: ansible_operator
        ansible_password: "{{ winrm_passwords[inventory_hostname] }}"
        iit_agent_path: C:\Program Files (x86)\Institute of Informational Technologies
        sedo_url: https://sedo.mod.gov.ua
        python_path: C:\Python311\python.exe
        # Must match where SETUP-WINDOWS.md / README clone the repo.
        client_path: C:\sedo-client

    # Linux worker(s) running sedo-client via Wine + virtual token.
    # No WinRM, no Windows box. See docs/LINUX-WINE-DEPLOYMENT.md
    sedo_workers_linux:
      hosts:
        lin01:
          ansible_host: 127.0.0.1
          ansible_connection: local
      vars:
        sedo_url: https://sedo.mod.gov.ua
