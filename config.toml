# sedo-client — базова конфігурація. Цей файл у репозиторії: без секретів і
# без машинних шляхів. Усе, що залежить від конкретної машини (шляхи до DLL,
# який токен за яку роль, звідки брати PIN), — у config_local.toml поруч із
# цим файлом (він у .gitignore; зразок — config_local.toml.example).
#
# Порядок перекриття:  config.toml → config_local.toml → змінні SEDO_* → прапорці CLI.
# Злиття по ключах: локальний файл може задати лише module для профілю, решта
# полів профілю береться звідси.
#
# Перевірити, що вийшло після злиття:  python sedo_client.py --show-config

[sedo]
url = "https://sedo.mod.gov.ua"
output = "./downloads"
# since = "2026-01-01"          # типове значення --since (YYYY-MM-DD)

# ── Профілі ключів ───────────────────────────────────────────────────────────
# Один профіль = один ключ: модуль (токен) і пара "приватний ключ ↔ сертифікат"
# на ньому. Профілів може бути скільки завгодно; ролі нижче кажуть, який з них
# логіниться в СЕДО, а який підписує документи.
#
# Поля профілю:
#   backend    auto | opensc | pkcs11 | virtual | iit_agent
#   module     шлях до PKCS#11 DLL (або $SEDO_MODULE; автопошук — $SEDO_MODULE_DIRS)
#   cert_id    CKA_ID пари у hex ("01"). Без нього пара обирається автоматично:
#              ключ і сертифікат з однаковим CKA_ID, при кількох — той, що
#              може підписувати, з найменшим id.
#   slot       номер слота (лише pkcs11 / virtual); без нього — перший з токеном
#   mechanism  зафіксувати механізм підпису ("0x80420031"); без нього — зі
#              списку токена (IIT і ST-338 «Автор»: 0x80420031)
#   key_file   Key-6.dat (лише virtual)
#   cert_index індекс сертифіката в EnumOwnCertificates (лише iit_agent; типово 0)
#   pin_env    змінна оточення з PIN; типово SEDO_PIN_<NAME> (NAME великими);
#              для ключа ролі auth додатково діє звичайний SEDO_PIN
#   pin_file   файл з PIN (один рядок); перевіряються права доступу
#   pin        лише в config_local.toml і лише з попередженням у лог
#
# Без жодного локального файлу все працює, як раніше: один ключ "default" на
# обидві ролі, PIN з --pin / $SEDO_PIN / запиту.

[keys.default]
backend = "auto"

# ── Ролі ─────────────────────────────────────────────────────────────────────
# auth — ключ, яким клієнт входить у СЕДО (підпис challenge при авторизації).
# sign — ключ, яким підписуються документи (підпис документів у самому СЕДО
#        ще не реалізований — потрібен Fiddler-запис; профіль уже можна
#        перевірити командою  python sedo_client.py --sign-file FILE).
# Обидві ролі на один профіль — звичайна робота з одним ключем.

[roles]
auth = "default"
sign = "default"
