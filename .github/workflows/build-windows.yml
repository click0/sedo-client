name: Build Windows binary

# Reusable build: called by release.yml on a v* tag, or run by hand for a
# dry-run. It never publishes — the single publish step lives in release.yml
# (one action-gh-release call, one sha256sums.txt covering every asset).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller
          pip install PyKCS11

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Build binary
        run: python scripts/build_binary.py

      - name: Smoke test
        run: dist\sedo-client.exe --help

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename binary
        shell: bash
        run: |
          mv dist/sedo-client.exe \
             "dist/sedo-client-${{ steps.ver.outputs.version }}-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedo-client-windows-x64
          path: dist/sedo-client-*-windows-x64.exe
          if-no-files-found: error
