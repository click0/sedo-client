name: Build Linux & FreeBSD binaries

# Reusable build: called by release.yml on a v* tag, or run by hand for a
# dry-run. It never publishes — the single publish step lives in release.yml
# (one action-gh-release call, one sha256sums.txt covering every asset).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies for PyKCS11
        run: sudo apt-get update && sudo apt-get install -y swig libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller pytest
          pip install PyKCS11

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build binary
        run: python scripts/build_binary.py

      - name: Smoke test
        run: ./dist/sedo-client --help

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename binary
        run: |
          mv dist/sedo-client \
             "dist/sedo-client-${{ steps.ver.outputs.version }}-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sedo-client-linux-x86_64
          path: dist/sedo-client-*-linux-x86_64
          if-no-files-found: error

  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y python311 py311-sqlite3 swig openssl
          run: |
            set -e
            # FreeBSD has no py311-pip package — bootstrap pip from the stdlib.
            python3.11 -m ensurepip --upgrade
            python3.11 -m pip install --upgrade pip
            python3.11 -m pip install requests pyinstaller pytest
            python3.11 -m pip install PyKCS11 || echo "PyKCS11 unavailable on FreeBSD — building opensc/iit_agent only"
            python3.11 -m pytest tests/ -q
            python3.11 scripts/build_binary.py
            ./dist/sedo-client --help

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename binary
        run: |
          mv dist/sedo-client \
             "dist/sedo-client-${{ steps.ver.outputs.version }}-freebsd-amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sedo-client-freebsd-amd64
          path: dist/sedo-client-*-freebsd-amd64
          if-no-files-found: error
