name: Build Linux & FreeBSD binaries

# Reusable build: called by release.yml on a v* tag, or run by hand for a
# dry-run. It never publishes — the single publish step lives in release.yml
# (one action-gh-release call, one sha256sums.txt covering every asset).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build dependencies for PyKCS11
        run: sudo apt-get update && sudo apt-get install -y swig libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller pytest
          pip install "PyKCS11>=1.5.15"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build binary
        run: python scripts/build_binary.py

      - name: Smoke test
        run: ./dist/sedo-client --help

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename binary
        run: |
          mv dist/sedo-client \
             "dist/sedo-client-${{ steps.ver.outputs.version }}-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sedo-client-linux-x86_64
          path: dist/sedo-client-*-linux-x86_64
          if-no-files-found: error

  build-freebsd:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; the cap turns a regression back to the
    # hour-long swig build (see .github/freebsd-build.sh) into a failure
    # instead of a slow green. It covers both VM attempts below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build runs inside the VM, but "Rename binary" and "Upload artifact"
      # below run on the Ubuntu host: they rely on vmactions copying the work
      # tree (dist/sedo-client included) back after `run` — its default
      # (copyback: true). If that is ever disabled, the rename step fails.
      #
      # Two attempts. Before the VM boots, the action downloads anyvm.py, the
      # FreeBSD image and its SSH key from GitHub release assets, and those
      # downloads fail now and then with 504: on 2026-11-08 four of six runs
      # died that way, the v0.35 release among them. A real failure inside the
      # VM (tests, build) fails the retry too, so the job still fails.
      - name: Build in FreeBSD VM
        id: vm1
        continue-on-error: true
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y python311 py311-sqlite3 swig openssl
          run: sh .github/freebsd-build.sh

      # A first attempt that failed after boot leaves its VM running, on the
      # SSH port and name the retry would use. Stop it, then give the release
      # downloads a minute.
      - name: Clean up before retrying the FreeBSD VM
        if: steps.vm1.outcome == 'failure'
        run: |
          sudo pkill -f qemu-system-x86_64 || true
          sleep 60

      - name: Build in FreeBSD VM (retry)
        if: steps.vm1.outcome == 'failure'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y python311 py311-sqlite3 swig openssl
          run: sh .github/freebsd-build.sh

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename binary
        run: |
          mv dist/sedo-client \
             "dist/sedo-client-${{ steps.ver.outputs.version }}-freebsd-amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sedo-client-freebsd-amd64
          path: dist/sedo-client-*-freebsd-amd64
          if-no-files-found: error
