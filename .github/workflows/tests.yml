name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: this job installs third-party packages and runs a build
# backend; it needs nothing else. (Without a block it inherited the repo
# default, which on older settings is read-write.)
permissions:
  contents: read

# A new push to the same PR supersedes the running matrix.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.11 — test every supported minor.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Through the extras, not by package name: a typo in an extra would
        # otherwise never fail a build. [analysis] brings pefile, so the
        # stdlib-vs-pefile cross-check in test_iit_inventory runs here too
        # (it used to be skipped in every CI run).
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,analysis]"

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Version headers match pyproject
        run: python scripts/check_version.py

      - name: Verify package builds and installs
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
          sedo-client --help
